name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - codex/sui-service-release-20260908
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Node 22 tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Public build configuration only. CI never receives wallet keys or deployment secrets.
      VITE_API_BASE_URL: https://trekkey-43-200-222-11.nip.io
      VITE_AUTH_API_BASE_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build production bundle
        run: npm run build
